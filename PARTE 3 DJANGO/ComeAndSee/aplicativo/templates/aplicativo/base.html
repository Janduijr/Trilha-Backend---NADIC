{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Come And See</title>
    <link rel="stylesheet" href="{% static 'aplicativo\css\style.css' %}">
</head>
<body>
    <header class="cabecalho">
        <div class="conteudo-cabecalho">
            
            <!-- Logo -->
            <a href="#" class="logo">
                <span class="circulos-logo">
                    <span class="circulo laranja"></span>
                    <span class="circulo verde"></span>
                    <span class="circulo azul"></span>
                </span>
                <span class="texto-logo">Come and See</span>
            </a>

            <!-- Navegação Principal -->
            <nav class="menu-navegacao">
                <!-- Usuário -->
                <div class="item-usuario">
                    <img src="https://via.placeholder.com/28" alt="Avatar do Usuário" class="foto-usuario">
                    <span class="nome-usuario">JANDUIJR</span>
                    <span class="seta-baixo">▾</span>
                </div>

                <!-- Links -->
                <a href="{% url 'listar_filmes' %}" class="link-menu">FILMES</a>
                <a href="#" class="link-menu">LISTAS</a>
                <a href="#" class="link-menu">MEMBROS</a>
                <a href="#" class="link-menu">DIÁRIO</a>

                <!-- Ícone de Busca -->
                <a href="#" class="link-busca" title="Buscar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>

                <!-- Botão Registrar/Log -->
                <a href="#" class="botao-registrar">
                    <span class="icone-mais">+</span> REGISTRAR
                </a>
            </nav>

        </div>
    </header>

    {% block conteudo %}
    {% endblock conteudo%}

</body>
</html>
