{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Come And See</title>
    <link rel="stylesheet" href="{% static 'aplicativo\css\style.css' %}">
</head>
<body>
    <header class="cabecalho">
        <div class="conteudo-cabecalho">
            
            <!-- Logo -->
            <a href="{% url 'index' %}" class="logo">
                <img src="{% static 'imagens/comeandsee.png' %}" alt="Come and See Logo" class="img-logo" width="30px">
                <span class="texto-logo">COME AND SEE</span>
            </a>

            <!-- Navegação Principal -->
            <nav class="menu-navegacao">
                <!-- Usuário -->
                <div class="item-usuario">
                    {% if user.is_authenticated %}
                        <img src="https://via.placeholder.com/28" alt="Avatar do Usuário" class="foto-usuario">
                        <span class="nome-usuario">{{user.username}}</span>
                        <span class="seta-baixo">▾</span>
                        <a class="link-menu" href="{% url 'logout' %}">Sair</a>
                    {% else %}
                       <a class="link-menu" href="{% url 'login' %}">Entrar</a>
                       <a class="link-menu" href="{% url 'register' %}">Registrar</a>
                    {% endif %}
                </div>

                <!-- Links -->
                <a href="{% url 'listar_filmes' %}" class="link-menu">FILMES</a>
                <a href="{% url 'listar_filmes_meus' %}" class="link-menu">MEUS FILMES</a>
                <a href="#" class="link-menu">MEMBROS</a>
                <a href="#" class="link-menu">DIÁRIO</a>

                <!-- Ícone de Busca -->
                <a href="#" class="link-busca" title="Buscar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>

                <!-- Botão Registrar/Log -->
                <a href="#" class="botao-registrar">
                    <span class="icone-mais">+</span> REGISTRAR
                </a>
            </nav>

        </div>
    </header>

    {% block conteudo %}
    {% endblock conteudo%}

</body>
</html>
