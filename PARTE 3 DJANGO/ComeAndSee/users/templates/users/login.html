{% extends 'aplicativo/base.html' %}

{% block conteudo %}
<div class="area-login">
    <div class="caixa-login">
        <h1 class="titulo-login">Entrar</h1>

        {% if form.errors %}
            <div class="erro">
                <p>Informações de login ou senha inválidas!</p>
            </div>
        {% endif %}

        <form class="formulario-login" action="{% url 'login' %}" method="post">
            {% csrf_token %}
            
            <div class="campos">
                {{ form.as_p }}
            </div>

            <button type="submit" name="submit" class="botao-entrar">Login</button>
            <input type="hidden" name="next" value="{% url 'index' %}">
        </form>
    </div>
</div>
{% endblock conteudo %}
