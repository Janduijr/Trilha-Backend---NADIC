{% extends 'aplicativo/base.html' %}

{% block conteudo %}
<div class="area-login">
    <div class="caixa-login">
        <h1 class="titulo-login">Criar Conta</h1>

        {% if form.errors %}
            <div class="erro">
                <p>Por favor, corrija os erros abaixo.</p>
            </div>
        {% endif %}

        <form class="formulario-login" action="{% url 'register' %}" method="post">
            {% csrf_token %}
            
            <div class="campos">
                {{ form.as_p }}
            </div>

            <button type="submit" name="submit" class="botao-entrar">Registrar</button>
            <input type="hidden" name="next" value="{% url 'index' %}">
        </form>

        <a href="{% url 'login' %}" class="link-alternativo">Já tem uma conta? Entrar</a>
    </div>
</div>
{% endblock conteudo %}
