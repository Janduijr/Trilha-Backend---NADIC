{% extends 'projetos/base.html' %}
{% load bootstrap3 %}

{% block header %}
    <h1><a href="{% url 'topic' topic.id %}">{{ topic }}</a></h1>
{% endblock header%}

{% block conteudo %}

    <h3>Editar entrada:</h3>

    <form action="{% url 'edit_entry' entry.id %}" method="post" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        
        {% buttons %}
            <button name="submit" class="btn btn-primary">Editar</button>
        {% endbuttons %}
    </form>

{% endblock conteudo %}
