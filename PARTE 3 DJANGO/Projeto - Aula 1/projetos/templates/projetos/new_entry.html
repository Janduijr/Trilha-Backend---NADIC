{% extends 'projetos/base.html' %}
{% load bootstrap3 %}

{% block header %}
    <h1><a href="{% url 'topic' topic.id%}">{{topic}}</a></h1>
{% endblock header %}

{% block conteudo %}
    <form action="{% url 'new_entry' topic.id %}" method='post' class="form">
        
        <h3>Adicione uma nova entrada:</h3>
        
        {% csrf_token %}
        {% bootstrap_form form %}

        {% buttons %}
            <button name='submit' class="btn btn-primary">Criar</button>
        {% endbuttons %}

    </form>
{% endblock conteudo %}
