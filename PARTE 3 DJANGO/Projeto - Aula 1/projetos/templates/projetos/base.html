<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>projeto</title>
</head>
<body>
    <p>
        <button type="button" class="btn-subtle theme-primary"><a href="{% url 'index' %}">Inicio</a></button>
        <button type="button" class="btn-subtle theme-primary"><a href="{% url 'topics' %}">Topicos</a></button>
        {% if user.is_authenticated %}
            ola, {{ user.username }}
            <button type="button" class="btn-subtle theme-danger"><a href="{% url 'logout' %}">Sair</a></button>
        {% else %}
            <button type="button" class="btn-subtle theme-success"><a href="{% url 'login' %}">Entrar</a></button>
            <button type="button" class="btn-subtle theme-success"><a href="{% url 'register' %}">Registrar</a></button>
        {% endif %}
    </p>
    {% block conteudo %}
    {% endblock %}
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
