{% extends 'projetos/base.html' %}

{% block conteudo %}
    <h3>topico:{{ topic }}</h3>
    <p>entries: </p>
    <ul>
        {% for entry in entries %}
            <li>
                <p>{{ entry.text|linebreaks }}</p>
                <p>{{ entry.date_added|date:'M D, Y H:i' }}</p>
            </li>
        {% empty %}
            <li>Nao ha itens!</li>
        {% endfor %}
    </ul>

{% endblock %}
